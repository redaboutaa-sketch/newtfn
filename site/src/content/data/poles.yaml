- id: ia
  ordre: 3
  nom: Intelligence artificielle et numérique
  nom_court: IA et numérique
  nom_long: Intelligence artificielle et numérique
  url: /formations/intelligence-artificielle/
  accent: ia
  accroche: "Usages professionnels de l'IA générative : rédaction, relation client, présence en ligne et organisation du travail."
  publics: [Artisans, TPE et indépendants, Entreprises et équipes, Particuliers et salariés]
  site_externe:
    marque: IA Tech Forma Nord
    url: https://iatechformanord.fr/
    contact_url: https://iatechformanord.fr/contact/
    # Relation vérifiée : iatechformanord.fr se présente comme « TFN · Tech Formation Nord »
    # et publie l'adresse 21 rue de Faches, 59175 Vendeville.
    relation: iatechformanord.fr est le site du pôle intelligence artificielle de Tech Formation Nord.
  familles:
    - id: artisans-tpe
      nom: Artisans, TPE et indépendants
      description: "Une formation de deux journées, idéalement espacées d'une semaine, pour construire sa présence en ligne (site, fiche Google) et un premier assistant IA à partir de ses propres tâches. Groupes de 6 à 8 participants, principalement en présentiel à Lille."
      points: [Clarifier son offre et rédiger ses contenus avec l'IA, Structurer un site simple et soigner sa visibilité locale, Concevoir un premier assistant IA et ses règles d'usage, Repartir avec un plan d'action sur 30 jours]
      lien: { url: "https://iatechformanord.fr/programme/", libelle: "Consulter le programme IA pour artisans et TPE" }
    - id: entreprises
      nom: Entreprises et équipes
      description: "Des formats pour les équipes et les dirigeants : formation par fonction (marketing, RH, commerce, direction) en 7 heures, accompagnement individuel, sessions de stratégie pour comités de direction et programme collaborateurs de 21 à 35 heures, en intra ou en inter-entreprises."
      points: [Prompts et cas d'usage adaptés à chaque métier, Production de contenus et de synthèses, Feuille de route d'adoption pour les équipes, Bonnes pratiques et confidentialité des données]
      lien: { url: "https://iatechformanord.fr/entreprises/", libelle: "Consulter les programmes IA pour les entreprises" }
    - id: particuliers
      nom: Particuliers et salariés
      description: "Des parcours individuels ou en petit groupe, de 16 à 35 heures, qui associent e-learning et séances avec un formateur pour découvrir puis approfondir l'IA générative. Les conditions de financement dépendent de votre situation et sont à étudier avant toute inscription."
      points: [Découvrir les usages courants de l'IA générative, Approfondir les fonctions avancées, Progresser à son rythme avec un formateur]
      lien: { url: "https://iatechformanord.fr/cpf/", libelle: "Consulter les parcours IA pour les particuliers" }
