  - id: conseiller-commercial-formation-automobile
    titre: "Conseiller(ère) commercial(e) en formation autour de l’automobile"
    contexte:
      - "Le/la conseiller(ère) commercial(e) en formation possède une maîtrise technique et actualisée en ingénierie de formation (les prestations de formation de son organisme de formation, les différents outils et méthodes pédagogiques, la réglementation et le financement des formations) doublée d’une compétence commerciale."
      - "Il/elle réalise la prospection de clients dans l’objectif de la vente de l’offre de formation de son organisme de formation (prestations de formation et services)."
      - "Il/elle a pour mission de promouvoir, placer sur le marché l’offre de formation et contribuer au développement de l’organisme de formation et à sa pérennisation ainsi que de conseiller, gérer et de fidéliser un portefeuille de clients et de prospects."
      - "Il/elle assure le reporting de son activité et de la satisfaction des clients et contribue au développement de l’organisme de formation par l’apport d’informations venant du terrain."
      - "Il/elle exerce son activité en autonomie, dans le respect de la politique commerciale de l’organisme de formation et de son champ de responsabilité fixé par son organisme de formation et sous la responsabilité de sa hiérarchie (par exemple : responsable ou directeur commercial ou responsable de l’organisme de formation)."
    contenu_titre: "Contenu de la formation"
    contenu:
