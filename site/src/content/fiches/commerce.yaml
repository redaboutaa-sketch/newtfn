    public: "Conseiller commercial VN/VO"
    prerequis: "Posséder au moins un diplôme, titre ou certificat (dont CQP ou Socle de compétences CléA)"
    benefices: "Augmenter le taux de reprise en accord avec votre stratégie commerciale et les attentes des clients"
