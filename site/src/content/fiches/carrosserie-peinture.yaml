      - "Les techniques de redressage par tringle/tige"
      - "Les techniques de redressage par ventouses/embouts collés"
      - "Le positionnement de la lumière et l’outil de redressage"
      - "Le contrôle du reflet par rapport à la lumière"
    applications:
