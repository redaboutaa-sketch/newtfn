  - id: 16-soudage-aluminium
    code: "16"
    titre: "Le soudage aluminium"
    contexte:
      - "L’utilisation de l’aluminium dans l’automobile devrait encore progresser de 10 à 20 % par an sur les cinq prochaines années. Le soudage des pièces en aluminium exige de la pratique ainsi que de bonnes connaissances théoriques. Découvrez les propriétés des différents aluminiums qui composent la structure d’un véhicule, ainsi que l’influence d’une opération de remplacement d’un élément soudé sur la résistance et le comportement au choc de la structure du véhicule."
    objectifs:
